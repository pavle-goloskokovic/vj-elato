<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>VJ Elato · Controller</title>
  <link rel="stylesheet" href="css/controller.css">
</head>
<body>
  <header>
    <div class="brand">VJ Elato</div>
    <div id="player-status" class="pill off">no player</div>
    <span id="gpu-status" class="muted"></span>
    <button id="open-player">Open player</button>
    <button id="pick-folder" title="Pick the folder with your clips (USB stick)">Clip folder…</button>
    <span id="folder-status" class="muted"></span>
    <span class="spacer"></span>
    <label class="toggle"><input type="checkbox" id="blackout" data-master="blackout"> <span>Blackout <kbd>B</kbd></span></label>
  </header>

  <main>
    <section id="library">
      <nav class="tabs">
        <button data-tab="stick">Stick</button>
        <button data-tab="destockd" class="active">Destockd</button>
        <button data-tab="spelunkr">Spelunkr</button>
        <button data-tab="url">URL</button>
      </nav>
      <div class="lib-controls">
        <input id="search" type="search" placeholder="Search…" autocomplete="off">
        <select id="filter"></select>
        <span id="count" class="muted"></span>
        <span class="spacer"></span>
        <label class="muted">load to
          <select id="target-deck"><option value="A">A</option><option value="B">B</option></select>
        </label>
      </div>
      <div id="url-panel" class="hidden">
        <input id="url-input" type="url" placeholder="https://…/clip.mp4">
        <button id="url-load">Load</button>
        <p class="muted">Any direct video URL. Streams play as a plain layer with the basic filters; the WebGL effects need local files from the clip folder.</p>
      </div>
      <div id="results"></div>
    </section>

    <section id="mixer">
      <div class="preview-strip" id="preview-strip">
        <div class="pane" data-pane="A"><img alt=""><span class="label">A</span><span class="badge"></span></div>
        <div class="pane" data-pane="out"><span class="label">OUT</span></div>
        <div class="pane" data-pane="B"><img alt=""><span class="label">B</span><span class="badge"></span></div>
        <video id="pvA" muted playsinline></video>
        <canvas id="preview-gl"></canvas>
        <video id="pvB" muted playsinline></video>
        <label class="live" title="Decode the clips here too, so the previews show the effects live. Off saves CPU."><input type="checkbox" id="live-preview" checked> live preview</label>
      </div>
      <div class="decks" id="decks"></div>

      <div class="master">
        <div class="xfade">
          <span class="deck-name a">A</span>
          <input type="range" id="crossfade" data-master="crossfade" min="0" max="1" step="0.005" value="0">
          <span class="deck-name b">B</span>
          <span class="muted"><kbd>←</kbd> <kbd>→</kbd></span>
        </div>
        <div class="params master-params">
          <label>feedback <input type="range" data-master="feedback" min="0" max="0.98" step="0.01" value="0"><output></output></label>
          <label>fb zoom <input type="range" data-master="fbZoom" min="0.9" max="1.1" step="0.002" value="1"><output></output></label>
          <label>fb rotate <input type="range" data-master="fbRotate" min="-10" max="10" step="0.1" value="0"><output></output></label>
          <label>fb hue <input type="range" data-master="fbHue" min="0" max="30" step="0.5" value="0"><output></output></label>
          <label>strobe <input type="range" data-master="strobe" min="0" max="20" step="0.5" value="0"><output></output></label>
          <label>render <select data-master="scale"><option value="0.5">50%</option><option value="0.75" selected>75%</option><option value="1">100%</option></select></label>
          <button class="reset" id="master-reset">reset master fx</button>
        </div>
      </div>
    </section>
  </main>

  <template id="deck-template">
    <div class="deck">
      <div class="deck-head"><span class="deck-name"></span><span class="title">empty</span><span class="mode muted"></span></div>
      <div class="time"><span class="t">0:00</span> / <span class="d">–:––</span></div>
      <input type="range" class="scrub" min="0" max="1000" value="0">
      <div class="transport">
        <button data-cmd="play">▶ <kbd class="key"></kbd></button>
        <button data-cmd="pause">❚❚</button>
        <button data-cmd="restart">⟲</button>
        <label><input type="checkbox" data-param="loop" checked> loop</label>
        <label>fit <select data-param="fit"><option value="contain">contain</option><option value="cover">cover</option></select></label>
        <label class="blend-only">blend <select data-param="blend">
          <option>normal</option><option>screen</option><option>multiply</option><option>difference</option>
          <option>lighten</option><option>darken</option><option>overlay</option><option>hard-light</option>
          <option>exclusion</option><option>add</option>
        </select></label>
      </div>
      <div class="params">
        <label>opacity <input type="range" data-param="opacity" min="0" max="1" step="0.01" value="1"><output></output></label>
        <label>speed <input type="range" data-param="speed" min="0.1" max="3" step="0.05" value="1"><output></output></label>
        <label>hue <input type="range" data-param="hue" min="0" max="360" step="1" value="0"><output></output></label>
        <label>saturate <input type="range" data-param="saturate" min="0" max="3" step="0.05" value="1"><output></output></label>
        <label>contrast <input type="range" data-param="contrast" min="0" max="3" step="0.05" value="1"><output></output></label>
        <label>brightness <input type="range" data-param="brightness" min="0" max="3" step="0.05" value="1"><output></output></label>
        <label>invert <input type="range" data-param="invert" min="0" max="1" step="0.01" value="0"><output></output></label>
        <label><span>blur <small>css</small></span> <input type="range" data-param="blur" min="0" max="30" step="0.5" value="0"><output></output></label>
        <label>zoom <input type="range" data-param="zoom" min="0.25" max="4" step="0.01" value="1"><output></output></label>
        <label>rotate <input type="range" data-param="rotate" min="-180" max="180" step="1" value="0"><output></output></label>
        <label><span>pixelate <small>gl</small></span> <input type="range" data-param="pixelate" min="0" max="1" step="0.01" value="0"><output></output></label>
        <label><span>rgb shift <small>gl</small></span> <input type="range" data-param="rgbShift" min="0" max="1" step="0.01" value="0"><output></output></label>
        <label><span>posterize <small>gl</small></span> <input type="range" data-param="posterize" min="0" max="16" step="1" value="0"><output></output></label>
        <label><span>threshold <small>gl</small></span> <input type="range" data-param="threshold" min="0" max="1" step="0.01" value="0"><output></output></label>
        <label><span>mirror <small>gl</small></span> <select data-param="mirror"><option value="0">off</option><option value="1">left–right</option><option value="2">top–bottom</option><option value="3">quad</option></select></label>
        <label><span>kaleido <small>gl</small></span> <select data-param="kaleido"><option value="0">off</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="8">8</option><option value="12">12</option><option value="16">16</option></select></label>
        <button class="reset">reset fx</button>
      </div>
    </div>
  </template>

  <script type="module" src="js/controller.js"></script>
</body>
</html>
